server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: spring-cloud-eureka-client-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: category
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-CATEGORY
          predicates:
            - Path=/category/**

        - id: author
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-AUTHOR
          predicates:
            - Path=/author/**

        - id: game
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-GAME
          predicates:
            - Path=/game/**

        - id: client
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-CLIENT
          predicates:
            - Path=/client/**

        - id: loan
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-LOAN
          predicates:
            - Path=/loan/**

        - id: auth
          uri: lb://SPRING-CLOUD-EUREKA-CLIENT-AUTH
          predicates:
            - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: TRACE