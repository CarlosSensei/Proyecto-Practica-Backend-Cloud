server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: spring-cloud-eureka-client-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: category
              uri: lb://SPRING-CLOUD-EUREKA-CLIENT-CATEGORY
              predicates:
                - Path=/category/**

            - id: author
              uri: lb://SPRING-CLOUD-EUREKA-CLIENT-AUTHOR
              predicates:
                - Path=/author/**

            - id: game
              uri: lb://SPRING-CLOUD-EUREKA-CLIENT-GAME
              predicates:
                - Path=/game/**

            - id: client
              uri: lb://SPRING-CLOUD-EUREKA-CLIENT-CLIENT
              predicates:
                - Path=/client/**

            - id: loan
              uri: lb://SPRING-CLOUD-EUREKA-CLIENT-LOAN
              predicates:
                - Path=/loan/**
  web:
    cors:
      allowed-origins: "http://localhost:4200"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG